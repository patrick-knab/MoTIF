[project]
name = "motif"
version = "0.1.0"
description = "Concept bottlenecks for interpretable video classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate==1.10.0",
  "av==15.0.0",
  "certifi>=2021.0.0",
  "click==8.2.1",
  "einops==0.8.1",
  "filelock==3.18.0",
  "ftfy==6.3.1",
  "huggingface-hub==0.34.4",
  "ipywidgets>=8.0.0",
  "joblib==1.5.1",
  "jupyter>=1.0.0",
  "matplotlib==3.10.5",
  "networkx==3.5",
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "openai==2.12.0",
  "packaging>=21.0",
  "pandas==2.3.1",
  "Pillow>=10.0.0",
  "platformdirs>=2.0.0",
  "protobuf==6.31.1",
  "psutil>=5.8.0",
  "pydantic==2.11.7",
  "pydantic-core==2.33.2",
  "regex==2025.7.34",
  "requests>=2.25.0",
  "safetensors==0.6.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "sentencepiece==0.2.1",
  "seaborn==0.13.2",
  "streamlit>=1.38.0",
  "threadpoolctl==3.6.0",
  "timm==1.0.19",
  "tokenizers==0.21.4",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "tqdm==4.67.1",
  "transformers==4.55.1",
  "urllib3>=1.26.0",
  "wandb==0.21.1",
  "clip @ git+https://github.com/openai/CLIP.git@dcba3cb2e2827b402d2701e7e1c7d9fed8a20ef1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv.extra-build-dependencies]
# OpenAI CLIP's legacy setup.py imports pkg_resources without declaring it.
clip = ["setuptools<81"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
